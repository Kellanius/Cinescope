name: Run Autotests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest

    - name: Install Playwright Browsers
      run: |
        # Установка системных зависимостей, необходимых для работы браузеров
        sudo apt-get update
        sudo apt-get install -y libwoff1 libopus0 libwebp6 libwebpdemux2 libenchant-2-2 libgudev-1.0-0 libsecret-1-0 libhyphen0 libgles2 libgstreamer-gl1.0-0 libgstreamer-plugins-bad1.0-0 gstreamer1.0-plugins-good gstreamer1.0-libav
        # Команда playwright install скачивает и устанавливает сами браузеры (Chromium, Firefox, WebKit)
        playwright install chromium
        # Можно добавить playwright install --with-deps для автоматической установки системных зависимостей,
        # но явная установка (как выше) часто надёжнее.

    - name: Create .env file from Secrets
      run: |
        # Создаём или перезаписываем файл .env и записываем в него переменные
        # Каждая переменная будет выглядеть так: DB_MOVIES_HOST=80.90.191.123
        cat << EOF > .env
        DB_MOVIES_HOST=${{ secrets.DB_MOVIES_HOST }}
        DB_MOVIES_PORT=${{ secrets.DB_MOVIES_PORT }}
        DB_MOVIES_NAME=${{ secrets.DB_MOVIES_NAME }}
        DB_MOVIES_USERNAME=${{ secrets.DB_MOVIES_USERNAME }}
        DB_MOVIES_PASSWORD=${{ secrets.DB_MOVIES_PASSWORD }}
        SUPER_ADMIN_USERNAME=${{ secrets.SUPER_ADMIN_USERNAME }}
        SUPER_ADMIN_PASSWORD=${{ secrets.SUPER_ADMIN_PASSWORD }}
        EOF

        echo "=== Проверка .env файла (пароли скрыты) ==="
        sed 's/PASSWORD=.*/PASSWORD=******/g' .env

    # САМОЕ ГЛАВНОЕ: ЭТО ШАГ, КОТОРЫЙ ЗАПУСКАЕТ ТВОИ ТЕСТЫ
    - name: Run Pytest
      run: |
        CI=true python -m pytest tests/ui/ -v
